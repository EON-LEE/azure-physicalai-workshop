name: Customer environment contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    name: CPU contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check local documentation links
        run: uv run --locked python -m scripts.check_docs

      - name: Run automated configuration tests
        run: uv run --locked pytest -q --junitxml=test-results/contracts.xml

      - name: Retain test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-results-python-${{ matrix.python }}
          path: test-results/contracts.xml
          if-no-files-found: error
          retention-days: 7
