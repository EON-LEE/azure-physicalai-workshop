name: Infrastructure syntax and invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
      - name: Restore locked dependencies
        run: uv sync --locked --group dev
      - name: Install the validated Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Compile and verify baseline invariants without Azure login
        run: uv run --locked python -m scripts.validate_infra
